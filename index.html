<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAF – Geschichte</title><style>*{box-sizing:border-box}body{margin:0;background:#151922;color:#e9edf5;font:16px system-ui}header{position:absolute;z-index:2;width:100%;padding:14px;background:#222936;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input{font:inherit;padding:9px;border:1px solid #526078;border-radius:8px;background:#30394a;color:white}button{cursor:pointer}#view{position:absolute;inset:0;overflow:hidden;touch-action:none;background-image:radial-gradient(#455064 1px,transparent 1px);background-size:24px 24px}#world{position:absolute;transform-origin:0 0}svg{position:absolute;overflow:visible;pointer-events:none}.node{position:absolute;width:190px;min-height:65px;transform:translate(-50%,-50%);border:2px solid #748cb3;background:#252d3b}.root{background:#843b45}.match{outline:4px solid #e9c46a}aside{position:absolute;right:12px;bottom:12px;width:min(380px,95%);max-height:55vh;overflow:auto;background:#252d3b;border:1px solid #526078;border-radius:12px;padding:18px;z-index:3}a{color:#9dc8ff}li{margin:8px 0}</style></head><body><header><strong>RAF · Geschichte</strong><input id="search" placeholder="Thema suchen" aria-label="Thema suchen"><button id="minus">−</button><button id="plus">+</button><button id="reset">Übersicht</button><span id="zoom"></span></header><div id="view"><div id="world"></div></div><aside id="detail" hidden></aside><script>
const data=[["RAF · 1970–1998",["Rote Armee Fraktion: linksextremistische terroristische Vereinigung in der Bundesrepublik."]],...[["Entstehung",["Studentenbewegung der 1960er-Jahre","Vietnamkrieg und Kritik an der NS-Aufarbeitung","Radikalisierung eines kleinen Teils der Protestbewegung","Gründung 1970"]],["Ideologie",["Linksextremismus","Antikapitalismus und Antiimperialismus","Ablehnung der bestehenden Staatsordnung"]],["Mitglieder",["Andreas Baader","Gudrun Ensslin","Ulrike Meinhof","Holger Meins","Christian Klar"]],["Generationen",["Erste: Gründung und frühe Gewalt","Zweite: Freipressung inhaftierter Mitglieder","Dritte: Fortsetzung des Terrorismus"]],["Anschläge",["Mai-Offensive 1972","Botschaftsgeiselnahme Stockholm 1975","Ermordung von Siegfried Buback und Jürgen Ponto 1977","Ermordung Alfred Herrhausens 1989","Ermordung Detlev Karsten Rohwedders 1991 – der RAF zugeschrieben","Anschlag auf die JVA Weiterstadt 1993"]],["Deutscher Herbst",["Entführung und Ermordung Hanns Martin Schleyers","Landshut 1977: Flugzeugentführung durch palästinensische Terroristen zur Unterstützung der RAF","Geiselbefreiung durch GSG 9 in Mogadischu","Todesnacht von Stammheim"]],["Staatliche Reaktion",["Fahndungen und Festnahmen","Stammheim-Prozess","Anti-Terror-Gesetze","Debatte über Grundrechte"]],["Opfer und Folgen",["Todesopfer und Verletzte","Langfristige Belastungen der Angehörigen","Veränderungen der Sicherheitspolitik"]],["Auflösung",["Auflösungserklärung im April 1998","Politische Ziele nicht erreicht","Teilweise ungeklärte Straftaten"]],["Quellen",["Weiterführende Institutionen; Einzelbelege noch zu ergänzen"]]]];
const v=document.querySelector('#view'),w=document.querySelector('#world'),d=document.querySelector('#detail');let x,y,s,drag;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');w.append(svg);const nodes=[];data.forEach((a,i)=>{let angle=(i-1)*Math.PI*2/(data.length-1),px=i?Math.cos(angle)*410:0,py=i?Math.sin(angle)*300:0;if(i){let l=document.createElementNS(svg.namespaceURI,'line');for(let [k,val] of Object.entries({x1:0,y1:0,x2:px,y2:py,stroke:'#657c9d','stroke-width':2}))l.setAttribute(k,val);svg.append(l)}let b=document.createElement('button');b.className='node'+(i?'':' root');b.style.left=px+'px';b.style.top=py+'px';b.textContent=a[0];b.onclick=()=>{d.hidden=false;d.replaceChildren();let c=document.createElement('button');c.textContent='Schließen';c.onclick=()=>d.hidden=true;d.append(c);let h=document.createElement('h2');h.textContent=a[0];d.append(h);let ul=document.createElement('ul');a[1].forEach(t=>{let li=document.createElement('li');li.textContent=t;ul.append(li)});d.append(ul);let p=document.createElement('p');p.textContent='Weiterführende Quellen (Startseiten):';d.append(p);for(let [t,u] of [['bpb','https://www.bpb.de/'],['LeMO','https://www.hdg.de/lemo/'],['Bundesarchiv','https://www.bundesarchiv.de/']]){let l=document.createElement('a');l.href=u;l.textContent=t;l.target='_blank';l.rel='noopener';d.append(l,document.createElement('br'))}};w.append(b);nodes.push(b)});function draw(){w.style.transform='translate('+x+'px,'+y+'px) scale('+s+')';document.querySelector('#zoom').textContent=Math.round(s*100)+'%'}function reset(){s=Math.max(.15,Math.min(1,(innerWidth-30)/1050,(innerHeight-150)/740));x=innerWidth/2;y=innerHeight/2+40;draw()}function zoom(f,cx=innerWidth/2,cy=innerHeight/2){let n=Math.max(.12,Math.min(5,s*f));x=cx-(cx-x)*n/s;y=cy-(cy-y)*n/s;s=n;draw()}v.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.001),e.clientX,e.clientY)},{passive:false});v.onpointerdown=e=>{if(e.target.closest('button'))return;drag=[e.clientX-x,e.clientY-y];v.setPointerCapture(e.pointerId)};v.onpointermove=e=>{if(drag){x=e.clientX-drag[0];y=e.clientY-drag[1];draw()}};v.onpointerup=v.onpointercancel=()=>drag=null;document.querySelector('#plus').onclick=()=>zoom(1.25);document.querySelector('#minus').onclick=()=>zoom(.8);document.querySelector('#reset').onclick=reset;document.querySelector('#search').oninput=e=>{let q=e.target.value.toLowerCase().trim();nodes.forEach((n,i)=>n.classList.toggle('match',!!q&&data[i].flat().join(' ').toLowerCase().includes(q)))};reset();
</script></body></html>
