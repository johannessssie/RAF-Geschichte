<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAF – Geschichte</title><style>*{box-sizing:border-box}body{margin:0;background:#151922;color:#e9edf5;font:16px system-ui}header{position:absolute;z-index:2;width:100%;padding:14px;background:#222936;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input{font:inherit;padding:9px;border:1px solid #526078;border-radius:8px;background:#30394a;color:white}button{cursor:pointer}#view{position:absolute;inset:0;overflow:hidden;touch-action:none;background-image:radial-gradient(#455064 1px,transparent 1px);background-size:24px 24px}#world{position:absolute;transform-origin:0 0}svg{position:absolute;overflow:visible;pointer-events:none}.node{position:absolute;width:190px;min-height:65px;transform:translate(-50%,-50%);border:2px solid #748cb3;background:#252d3b}.root{background:#843b45}.match{outline:4px solid #e9c46a}aside{position:absolute;right:12px;bottom:12px;width:min(380px,95%);max-height:55vh;overflow:auto;background:#252d3b;border:1px solid #526078;border-radius:12px;padding:18px;z-index:3}a{color:#9dc8ff}li{margin:8px 0}#sourcesButton{position:fixed;bottom:12px;left:12px;z-index:4;font-size:13px}#sourcesDialog{background:#252d3b;color:#e9edf5;border:1px solid #526078;border-radius:12px;padding:22px;width:min(420px,90vw)}#sourcesDialog::backdrop{background:#0008}/* Zeitgeschichtliches Archivdesign */
:root{color-scheme:dark}body{background:#211f1c;color:#eee7d8;font-family:system-ui,sans-serif}header{background:#292622;border-bottom:3px solid #a34b40;box-shadow:0 4px 18px #0005}header strong{font-family:Georgia,serif;font-size:23px;letter-spacing:.03em}button,input{background:#35312b;border-color:#766b5b;color:#eee7d8}button:hover{background:#484036}button:focus-visible,input:focus-visible{outline:2px solid #d5b68a;outline-offset:3px}#view{background-color:#211f1c;background-image:linear-gradient(#b5a18a0b 1px,transparent 1px),linear-gradient(90deg,#b5a18a0b 1px,transparent 1px);background-size:32px 32px}.node{background:#35312b;border:1px solid #8d806c;border-radius:3px;box-shadow:3px 5px 0 #0004;font-weight:650;letter-spacing:.02em}.root{background:#743c35;border:2px solid #c68a79;font-family:Georgia,serif;font-size:21px}.match{outline-color:#d5b68a}aside,#sourcesDialog{background:#302b25;border-color:#8d806c;color:#eee7d8;border-radius:4px;box-shadow:0 8px 32px #0008}aside h2,#sourcesDialog h2{font-family:Georgia,serif;color:#f0dfc4;border-bottom:1px solid #8d806c;padding-bottom:10px}a{color:#e3ba91}#sourcesButton{background:#302b25;border-color:#766b5b;border-radius:3px}#archiveLabel{position:fixed;bottom:14px;right:14px;color:#b9ac98;font-size:11px;letter-spacing:.12em;pointer-events:none;text-align:right}aside:not([hidden])~#archiveLabel{display:none}@media(max-width:600px){header strong{font-size:19px}#archiveLabel{font-size:9px}header input{max-width:155px}}.branch{border-left:6px solid var(--branch);border-color:var(--branch)}.child{width:245px;min-height:65px;font-size:14px;border-color:var(--branch);border-left:5px solid var(--branch)}.branch small{display:block;font-size:11px;opacity:.8;margin-top:5px}.back{font-size:13px;margin-left:8px}</style></head><body><header><strong>RAF / Geschichte</strong><input id="search" placeholder="Thema suchen" aria-label="Thema suchen"><button id="minus">−</button><button id="plus">+</button><button id="reset">Übersicht</button><span id="zoom"></span></header><div id="view"><div id="world"></div></div><aside id="detail" hidden></aside><script>

const v=document.querySelector('#view'),w=document.querySelector('#world'),d=document.querySelector('#detail');let x,y,s,drag;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');w.append(svg);const details=[["Proteste gegen überkommene gesellschaftliche Strukturen prägten die Bundesrepublik. Die Studentenbewegung insgesamt war nicht terroristisch.","Der Vietnamkrieg und der Umgang mit der NS-Vergangenheit waren zentrale Protestthemen.","Nur eine Minderheit entschied sich für politische Gewalt.","Die RAF formierte sich 1970 um Baader, Ensslin und Meinhof."],["Die RAF bekämpfte die parlamentarische Demokratie mit terroristischer Gewalt.","Sie deutete Kapitalismus und westliche Machtpolitik als Unterdrückungssysteme.","Sie wollte die politische Ordnung gewaltsam umgestalten."],["Mitbegründer und zentrale Figur der ersten Generation.","Mitbegründerin und zentrale Figur der ersten Generation.","Journalistin und Mitbegründerin der RAF.","Starb 1974 während eines Hungerstreiks in Haft.","Mitglied der späteren RAF; seine Biografie wird noch mit einem Einzelbeleg ergänzt."],["1970–1975: Aufbau der Gruppe und terroristische Gewalt.","1975–1981: Schwerpunkt war die erzwungene Freilassung Gefangener.","1982–1998: internationale Ausrichtung und Gewalt gegen Repräsentanten von Politik und Wirtschaft."],["1972: Anschlagsserie gegen staatliche, militärische und mediale Einrichtungen.","1975: Die Geiselnahme in der deutschen Botschaft in Schweden stand im Zusammenhang mit Forderungen nach Freilassung von Gefangenen.","1977 wurden der Generalbundesanwalt und der Vorstandsvorsitzende der Dresdner Bank ermordet.","Herrhausen war Vorstandssprecher der Deutschen Bank.","Rohwedder leitete die Treuhandanstalt. Die individuelle Täterschaft bleibt ungeklärt.","1993: Anschlag auf eine Justizvollzugsanstalt. Ein konkreter Einzelbeleg wird noch ergänzt."],["Schleyer war Arbeitgeberpräsident. Seine Ermordung prägte die politische Krise 1977.","Die Flugzeugentführung war keine unmittelbar von der RAF ausgeführte Tat.","Die Befreiung der Geiseln war ein zentraler Teil der staatlichen Krisenbewältigung.","Die Todesfälle in Stammheim wurden zu einem Gegenstand öffentlicher Debatten."],["Die Sicherheitsbehörden bauten die Fahndung aus.","Ab 1975 standen führende Mitglieder der ersten Generation vor Gericht.","§ 129a StGB regelt Straftaten im Zusammenhang mit terroristischen Vereinigungen.","Die Maßnahmen warfen Fragen nach rechtsstaatlichen Grenzen auf."],["Die Gewalt traf Menschen aus unterschiedlichen gesellschaftlichen Bereichen.","Angehörige kämpfen um Erinnerung und Aufklärung.","Die Sicherheitsbehörden erhielten zusätzliche Ressourcen und Befugnisse."],["Im April 1998 erklärte die RAF ihr Ende.","Die demokratische Ordnung der Bundesrepublik blieb bestehen.","Die historische und strafrechtliche Aufarbeitung ist nicht vollständig abgeschlossen."]];const colors=['#d1ad71','#b6a0dc','#81b8a3','#81a9d6','#d48278','#d8a36f','#81bfca','#c2b7a2','#a7bb80'];let nodes=[],active=0;function line(x1,y1,x2,y2,color){let l=document.createElementNS(svg.namespaceURI,'line');for(const [k,val] of Object.entries({x1,y1,x2,y2,stroke:color,'stroke-width':2}))l.setAttribute(k,val);svg.append(l)}function info(title,body){d.hidden=false;d.replaceChildren();let c=document.createElement('button');c.textContent='Schließen';c.onclick=()=>d.hidden=true;let h=document.createElement('h2');h.textContent=title;let p=document.createElement('p');p.textContent=body;d.append(c,h,p)}function node(title,px,py,cls,color,cb,searchText,count){let b=document.createElement('button');b.className='node '+cls;b.style.left=px+'px';b.style.top=py+'px';b.style.setProperty('--branch',color);b.textContent=title;if(count){let small=document.createElement('small');small.textContent=count+' Unterthemen';b.append(small)}b.onclick=cb;w.append(b);nodes.push([b,searchText]);return b}function render(i=0){active=i;svg.replaceChildren();w.querySelectorAll('.node').forEach(n=>n.remove());nodes=[];if(!i){node('RAF',0,0,'root','#c68a79',()=>info('RAF',data[0][1][0]),data[0].flat().join(' '));data.slice(1).forEach((a,j)=>{let angle=j*Math.PI*2/(data.length-1),px=Math.cos(angle)*410,py=Math.sin(angle)*300;line(0,0,px,py,colors[j]);node(a[0],px,py,'branch',colors[j],()=>{render(j+1);d.hidden=true;reset()},a.flat().join(' ')+' '+details[j].join(' '),a[1].length)})}else{let a=data[i],color=colors[i-1];node(a[0],-210,0,'branch',color,()=>{render();d.hidden=true;reset()},a[0]);a[1].forEach((t,j)=>{let py=(j-(a[1].length-1)/2)*110;line(-210,0,210,py,color);node(t,210,py,'child',color,()=>info(t,details[i-1][j]),t+' '+details[i-1][j])})}highlight()}function highlight(){let q=document.querySelector('#search').value.toLowerCase().trim();nodes.forEach(([n,t])=>n.classList.toggle('match',!!q&&t.toLowerCase().includes(q)))};function draw(){w.style.transform='translate('+x+'px,'+y+'px) scale('+s+')';document.querySelector('#zoom').textContent=Math.round(s*100)+'%'}function reset(){s=Math.max(.15,Math.min(1,(innerWidth-30)/1050,(innerHeight-150)/740));x=innerWidth/2;y=innerHeight/2+40;draw()}function zoom(f,cx=innerWidth/2,cy=innerHeight/2){let n=Math.max(.12,Math.min(5,s*f));x=cx-(cx-x)*n/s;y=cy-(cy-y)*n/s;s=n;draw()}v.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.001),e.clientX,e.clientY)},{passive:false});v.onpointerdown=e=>{if(e.target.closest('button'))return;drag=[e.clientX-x,e.clientY-y];v.setPointerCapture(e.pointerId)};v.onpointermove=e=>{if(drag){x=e.clientX-drag[0];y=e.clientY-drag[1];draw()}};v.onpointerup=v.onpointercancel=()=>drag=null;document.querySelector('#plus').onclick=()=>zoom(1.25);document.querySelector('#minus').onclick=()=>zoom(.8);document.querySelector('#reset').onclick=()=>{render();d.hidden=true;reset()};document.querySelector('#search').oninput=highlight;render();reset();
</script><button id="sourcesButton" type="button" aria-haspopup="dialog">Quellen</button><dialog id="sourcesDialog"><h2>Quellenverzeichnis</h2><p>Gesammelte Quellen und weiterführende Institutionen</p><ul id="sourceList"></ul><p id="sourceStatus" role="status"></p><p>Konkrete Einzelbelege werden noch ergänzt.</p><form method="dialog"><button>Schließen</button></form></dialog><script>document.querySelector('#sourcesButton').onclick=async()=>{document.querySelector('#sourcesDialog').showModal();const list=document.querySelector('#sourceList'),status=document.querySelector('#sourceStatus');list.replaceChildren();status.textContent='Quellen werden geladen …';try{const response=await fetch('./sources.json',{cache:'no-cache'});if(!response.ok)throw Error('HTTP '+response.status);const sources=await response.json();for(const source of sources){const url=new URL(source.url);if(url.protocol!=='https:')continue;const li=document.createElement('li'),a=document.createElement('a');a.href=url.href;a.target='_blank';a.rel='noopener';a.textContent=source.title;li.append(a);if(source.type){const small=document.createElement('small');small.textContent=source.type;small.style.display='block';li.append(small)}list.append(li)}status.textContent='';}catch(e){status.textContent='Quellen konnten nicht geladen werden. Bitte erneut öffnen.'}};</script><div id="archiveLabel">ZEITGESCHICHTE<br>HISTORISCHE DOKUMENTATION</div></body></html>
