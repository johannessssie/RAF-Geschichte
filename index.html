const v=document.querySelector('#view'),w=document.querySelector('#world'),d=document.querySelector('#detail');let x,y,s,drag;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');w.append(svg);const nodes=[];data.forEach((a,i)=>{let angle=(i-1)*Math.PI*2/(data.length-1),px=i?Math.cos(angle)*410:0,py=i?Math.sin(angle)*300:0;if(i){let l=document.createElementNS(svg.namespaceURI,'line');for(let [k,val] of Object.entries({x1:0,y1:0,x2:px,y2:py,stroke:'#8d806c','stroke-width':2}))l.setAttribute(k,val);svg.append(l)}let b=document.createElement('button');b.className='node'+(i?'':' root');b.style.left=px+'px';b.style.top=py+'px';b.textContent=a[0];b.onclick=()=>{d.hidden=false;d.replaceChildren();let c=document.createElement('button');c.textContent='Schließen';c.onclick=()=>d.hidden=true;d.append(c);let h=document.createElement('h2');h.textContent=a[0];d.append(h);let ul=document.createElement('ul');a[1].forEach(t=>{let li=document.createElement('li');li.textContent=t;ul.append(li)});d.append(ul);};w.append(b);nodes.push(b)});function draw(){w.style.transform='translate('+x+'px,'+y+'px) scale('+s+')';document.querySelector('#zoom').textContent=Math.round(s*100)+'%'}function reset(){s=Math.max(.15,Math.min(1,(innerWidth-30)/1050,(innerHeight-150)/740));x=innerWidth/2;y=innerHeight/2+40;draw()}function zoom(f,cx=innerWidth/2,cy=innerHeight/2){let n=Math.max(.12,Math.min(5,s*f));x=cx-(cx-x)*n/s;y=cy-(cy-y)*n/s;s=n;draw()}v.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.001),e.clientX,e.clientY)},{passive:false});v.onpointerdown=e=>{if(e.target.closest('button'))return;drag=[e.clientX-x,e.clientY-y];v.setPointerCapture(e.pointerId)};v.onpointermove=e=>{if(drag){x=e.clientX-drag[0];y=e.clientY-drag[1];draw()}};v.onpointerup=v.onpointercancel=()=>drag=null;document.querySelector('#plus').onclick=()=>zoom(1.25);document.querySelector('#minus').onclick=()=>zoom(.8);document.querySelector('#reset').onclick=reset;document.querySelector('#search').oninput=e=>{let q=e.target.value.toLowerCase().trim();nodes.forEach((n,i)=>n.classList.toggle('match',!!q&&data[i].flat().join(' ').toLowerCase().includes(q)))};reset();
</script><button id="sourcesButton" type="button" aria-haspopup="dialog">Quellen</button><dialog id="sourcesDialog"><h2>Quellenverzeichnis</h2><p>Gesammelte Quellen und weiterführende Institutionen</p><ul id="sourceList"></ul><p id="sourceStatus" role="status"></p><p>Konkrete Einzelbelege werden noch ergänzt.</p><form method="dialog"><button>Schließen</button></form></dialog><script>document.querySelector('#sourcesButton').onclick=async()=>{document.querySelector('#sourcesDialog').showModal();const list=document.querySelector('#sourceList'),status=document.querySelector('#sourceStatus');list.replaceChildren();status.textContent='Quellen werden geladen …';try{const response=await fetch('./sources.json',{cache:'no-cache'});if(!response.ok)throw Error('HTTP '+response.status);const sources=await response.json();for(const source of sources){const url=new URL(source.url);if(url.protocol!=='https:')continue;const li=document.createElement('li'),a=document.createElement('a');a.href=url.href;a.target='_blank';a.rel='noopener';a.textContent=source.title;li.append(a);if(source.type){const small=document.createElement('small');small.textContent=source.type;small.style.display='block';li.append(small)}list.append(li)}status.textContent='';}catch(e){status.textContent='Quellen konnten nicht geladen werden. Bitte erneut öffnen.'}};</script><div id="archiveLabel">ZEITGESCHICHTE · 1970–1998<br>HISTORISCHE DOKUMENTATION</div></body></html>
